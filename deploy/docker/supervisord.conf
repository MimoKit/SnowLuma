; Xvfb, QQ and SnowLuma share one container. Children inherit the container
; environment (HOME, DISPLAY, XDG_RUNTIME_DIR, DBUS_SESSION_BUS_ADDRESS), so
; only the process definitions differ.
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_SNOWLUMA_SCREEN)sx24 -nolisten tcp -ac
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=fluxbox
user=snowluma
priority=20
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbauth /etc/x11vnc.pass -rfbport 5900 -noxdamage -nolookup
priority=30
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web=/usr/share/novnc 6081 127.0.0.1:5900
priority=40
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; QQ has to be up first: the hook attaches to the running client. Logging the
; account in happens over VNC, then the hook picks the login up on its own.
[program:qq]
command=qq --no-sandbox
directory=/app/home
user=snowluma
priority=50
autostart=true
autorestart=true
startsecs=10
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:snowluma]
command=%(ENV_SNOWLUMA_HOME)s/node %(ENV_SNOWLUMA_HOME)s/index.mjs
directory=/app/data
user=snowluma
priority=60
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
