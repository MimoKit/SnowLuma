services:
  snowluma:
    image: ghcr.io/mimokit/snowluma:latest
    container_name: snowluma
    restart: unless-stopped
    # The hook injects into the running QQ process, which needs ptrace.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: 1g
    environment:
      TZ: Asia/Shanghai
      VNC_PASSWD: snowluma
      SNOWLUMA_WEBUI_PORT: "5099"
    ports:
      - "5099:5099" # SnowLuma WebUI
      - "6081:6081" # noVNC
      - "5900:5900" # VNC
      - "3000:3000" # OneBot HTTP
      - "3001:3001" # OneBot WebSocket
    volumes:
      - snowluma-data:/app/data
      - snowluma-home:/app/home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5099/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  snowluma-data:
  snowluma-home:
